name: Release

on: 
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir staging
          cp target/release/screen-ocr staging/
          tar -czvf screen-ocr-linux.tar.gz -C staging screen-ocr

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: screen-ocr-linux.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir staging
          cp target/release/screen-ocr.exe staging/
          7z a screen-ocr-windows.zip staging/screen-ocr.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: screen-ocr-windows.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
